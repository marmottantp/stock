function LoginScreen({onLogin}) {
  const [email, setEmail] = useState("");
  const [pwd, setPwd] = useState("");
  const [show, setShow] = useState(false);
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");

  const go = async () => {
    if (!email || !pwd) { setErr("Remplissez les deux champs."); return; }
    setLoading(true); setErr("");
    try {
      if (!window._fbReady) await new Promise(r => window.addEventListener("fb-ready", r, {once:true}));
      await window._fa.signInWithEmailAndPassword(window._auth, email.trim(), pwd);
      onLogin(email.trim());
    } catch(e) {
      const msg = (e.code==="auth/invalid-credential"||e.code==="auth/wrong-password"||e.code==="auth/user-not-found")
        ? "Email ou mot de passe incorrect."
        : e.code==="auth/too-many-requests"
        ? "Trop de tentatives. Attendez quelques minutes."
        : "Erreur de connexion.";
      setErr(msg);
    } finally { setLoading(false); }
  };

  return (
    <div style={{minHeight:"100vh",background:"#f5f5f3",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'DM Mono',monospace"}}>
      <style>{CSS}</style>
      <div style={{width:400,padding:44,background:"#fff",border:"1px solid #e0e0e0",borderRadius:6}}>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:32}}>
          <div style={{width:38,height:38,background:"#e8a000",borderRadius:4,display:"flex",alignItems:"center",justifyContent:"center"}}>
            <span style={{fontSize:20,fontWeight:700,color:"#fff"}}>S</span>
          </div>
          <div>
            <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:17,color:"#1a1a1a",letterSpacing:".1em"}}>STOCKFLOW</div>
            <div style={{fontSize:11,color:"#aaa"}}>Marmottan TP</div>
          </div>
        </div>
        <div style={{marginBottom:14}}>
          <label style={{display:"block",fontSize:11,color:"#888",marginBottom:6,textTransform:"uppercase",letterSpacing:".08em"}}>Adresse email</label>
          <select className="if" value={email} onChange={e=>setEmail(e.target.value)}>
            <option value="">-- Choisir votre compte --</option>
            {USERS.map(u=><option key={u} value={u}>{u}</option>)}
          </select>
        </div>
        <div style={{marginBottom:err?8:20}}>
          <label style={{display:"block",fontSize:11,color:"#888",marginBottom:6,textTransform:"uppercase",letterSpacing:".08em"}}>Mot de passe</label>
          <div style={{position:"relative"}}>
            <input type={show?"text":"password"} placeholder="Votre mot de passe..." value={pwd}
              onChange={e=>setPwd(e.target.value)} onKeyDown={e=>e.key==="Enter"&&go()}
              style={{width:"100%",background:"#fff",border:"1px solid "+(err?"#d05040":"#d0d0d0"),color:"#1a1a1a",padding:"10px 44px 10px 14px",fontFamily:"'DM Mono',monospace",fontSize:13,borderRadius:2,outline:"none",boxSizing:"border-box"}}/>
            <button onClick={()=>setShow(s=>!s)} style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:"#aaa",cursor:"pointer",fontSize:12,fontFamily:"'DM Mono',monospace"}}>
              {show?"cacher":"voir"}
            </button>
          </div>
        </div>
        {err && <p style={{color:"#d05040",fontSize:12,marginBottom:14}}>{err}</p>}
        <button onClick={go} disabled={loading} style={{width:"100%",background:loading?"#c8a030":"#e8a000",color:"#fff",border:"none",padding:"12px",fontFamily:"'DM Mono',monospace",fontSize:14,fontWeight:500,borderRadius:2,cursor:loading?"not-allowed":"pointer"}}>
          {loading?"Connexion...":"Se connecter"}
        </button>
        <p style={{fontSize:11,color:"#ccc",marginTop:16,textAlign:"center"}}>Acces reserve aux employes Marmottan TP</p>

}

function StockApp({user, onLogout}) {
  const [products, setProducts]         = useState(DEF_PRODS);
  const [movements, setMovements]       = useState(DEF_MOVS);
  const [locations, setLocations]       = useState(DEF_LOCS);
  const [locationStock, setLS]          = useState(DEF_LS);
  const [categories, setCategories]     = useState(DEF_CATS);
  const [chantiers, setChantiers]       = useState(DEF_CHANTIERS);
  const [dbReady, setDbReady]           = useState(false);
  const [syncing, setSyncing]           = useState(false);
  const [lastSync, setLastSync]         = useState(null);
  const [view, setView]                 = useState("dashboard");
  const [search, setSearch]             = useState("");
  const [filterCat, setFilterCat]       = useState("Tous");
  const [filterLoc, setFilterLoc]       = useState("Tous");
  const [sortBy, setSortBy]             = useState("name");
  const [modal, setModal]               = useState(null);
  const [form, setForm]                 = useState({});
  const [toast, setToast]               = useState(null);
  const [catEdit, setCatEdit]           = useState("");
  const [catRen, setCatRen]             = useState({});
  const nP = useRef(1000), nM = useRef(1000), nL = useRef(100), nC = useRef(10);
  const saveT = useRef(null);
  const userName = user.split("@")[0].charAt(0).toUpperCase() + user.split("@")[0].slice(1);

  const showToast = (msg, type="success") => { setToast({msg,type}); setTimeout(()=>setToast(null),3500); };

  useEffect(()=>{
    const init = async () => {
      if (!window._fbReady) await new Promise(r=>window.addEventListener("fb-ready",r,{once:true}));
      const {doc, getDoc, onSnapshot} = window._fs, db = window._db;
      try {
        const snap = await getDoc(doc(db,"stockflow","data"));
        if (snap.exists()) {
          const d = snap.data();
          if (d.products)      { setProducts(d.products);   nP.current = Math.max(...d.products.map(x=>x.id))+1; }
          if (d.movements)     { setMovements(d.movements);  nM.current = Math.max(...d.movements.map(x=>x.id))+1; }
          if (d.locations)     { setLocations(d.locations);  nL.current = Math.max(...d.locations.map(x=>x.id))+1; }
          if (d.locationStock)   setLS(d.locationStock);
          if (d.categories)      setCategories(d.categories);
          if (d.chantiers)     { setChantiers(d.chantiers);  nC.current = Math.max(...d.chantiers.map(x=>x.id))+1; }
        }
        setDbReady(true); setLastSync(new Date());
        onSnapshot(doc(db,"stockflow","data"), s => {
          if (s.exists()) {
            const d = s.data();
            if (d.products)    { setProducts(d.products);   nP.current = Math.max(nP.current,...d.products.map(x=>x.id))+1; }
            if (d.movements)   { setMovements(d.movements);  nM.current = Math.max(nM.current,...d.movements.map(x=>x.id))+1; }
            if (d.locations)   { setLocations(d.locations);  nL.current = Math.max(nL.current,...d.locations.map(x=>x.id))+1; }
            if (d.locationStock) setLS(d.locationStock);
            if (d.categories)    setCategories(d.categories);
            if (d.chantiers)   { setChantiers(d.chantiers);  nC.current = Math.max(nC.current,...d.chantiers.map(x=>x.id))+1; }
            setLastSync(new Date());
          }
        });
      } catch(e) { showToast("Erreur Firebase","error"); setDbReady(true); }
    };
    init();
  }, []);

  const save = useCallback((data) => {
    if (!window._fbReady) return;
    if (saveT.current) clearTimeout(saveT.current);
    saveT.current = setTimeout(async () => {
      setSyncing(true);
      try {
        const {doc, setDoc} = window._fs;
        await setDoc(doc(window._db,"stockflow","data"), data);
        setLastSync(new Date());
      } catch { showToast("Erreur sauvegarde","error"); }
      finally { setSyncing(false); }
    }, 600);
  }, []);

  const saveAll = (p,m,l,ls,c,ch) => save({
    products: p||products, movements: m||movements, locations: l||locations,
    locationStock: ls||locationStock, categories: c||categories, chantiers: ch||chantiers
  });

  const getTS  = pid => Object.entries(locationStock).filter(([k])=>k.startsWith(pid+"_")).reduce((s,[,v])=>s+v,0);
  const getLS2 = (pid,lid) => locationStock[pid+"_"+lid]||0;
  const getLN  = id => locations.find(l=>l.id===id)?.name||"--";
  const getLC  = id => locations.find(l=>l.id===id)?.color||"#888";
  const getPN  = id => products.find(p=>p.id===id)?.name||"--";
  const getCHN = id => chantiers.find(c=>c.id===id)?.name||"--";

  const enr = products.map(p=>({...p, quantity:getTS(p.id)}));
  const fil = enr
    .filter(p => filterCat==="Tous" || p.category===filterCat)
    .filter(p => filterLoc==="Tous" || getLS2(p.id,parseInt(filterLoc))>0)
    .filter(p => p.name.toLowerCase().includes(search.toLowerCase()) || p.sku.toLowerCase().includes(search.toLowerCase()))
    .sort((a,b) => {
      if (sortBy==="name")        return a.name.localeCompare(b.name);
      if (sortBy==="nameDesc")    return b.name.localeCompare(a.name);
      if (sortBy==="quantity")    return b.quantity-a.quantity;
      if (sortBy==="quantityAsc") return a.quantity-b.quantity;
      if (sortBy==="category")    return a.category.localeCompare(b.category);
      if (sortBy==="status") {
        const sc = p => { const r=p.quantity/p.minStock; return p.quantity===0?0:r<=1?1:r<=1.5?2:3; };
        return sc(a)-sc(b);
      }
      return 0;
    });

  const lowStock = enr.filter(p=>p.quantity<=p.minStock);
  const todayMov = movements.filter(m=>m.date===TODAY);

  const addCat = () => {
    const n = catEdit.trim();
    if (!n) return showToast("Entrez un nom","error");
    if (categories.includes(n)) return showToast("Existe deja","error");
    const nc = [...categories, n]; setCategories(nc); setCatEdit("");
    saveAll(null,null,null,null,nc,null); showToast("Categorie ajoutee !");
  };
  const renameCat = (old, nw) => {
    nw = nw.trim();
    if (!nw) return showToast("Nom vide","error");
    if (categories.includes(nw) && nw!==old) return showToast("Existe deja","error");
    const nc = categories.map(c=>c===old?nw:c);
    const np = products.map(p=>p.category===old?{...p,category:nw}:p);
    setCategories(nc); setProducts(np); setCatRen({});
    saveAll(np,null,null,null,nc,null); showToast("Renommee !");
  };
  const delCat = n => {
    if (products.some(p=>p.category===n)) return showToast("Utilisee par des produits","error");
    const nc = categories.filter(c=>c!==n); setCategories(nc);
    if (filterCat===n) setFilterCat("Tous");
    saveAll(null,null,null,null,nc,null); showToast("Supprimee");
  };

  const handleMov = () => {
    const {type, productId, locationId, toLocationId, quantity, reason, ref, chantierId} = form;
    if (!productId||!locationId||!quantity||!reason) return showToast("Champs obligatoires manquants","error");
    if (type==="transfert" && !toLocationId) return showToast("Choisissez destination","error");
    if (type==="transfert" && locationId===toLocationId) return showToast("Lieux identiques","error");
    const qty=parseInt(quantity), pId=parseInt(productId), lId=parseInt(locationId);
    const toLId = toLocationId ? parseInt(toLocationId) : null;
    const src = getLS2(pId, lId);
    if ((type==="sortie"||type==="transfert") && src<qty) return showToast("Stock insuffisant ("+src+" dispo)","error");
    const nls = {...locationStock};
    const k = pId+"_"+lId, tk = pId+"_"+toLId;
    if (type==="entree")   nls[k] = (nls[k]||0)+qty;
    if (type==="sortie")   nls[k] = (nls[k]||0)-qty;
    if (type==="transfert") { nls[k]=(nls[k]||0)-qty; nls[tk]=(nls[tk]||0)+qty; }
    Object.keys(nls).forEach(k2=>{ if(nls[k2]<=0) delete nls[k2]; });
    const chId = chantierId ? parseInt(chantierId) : null;
    const autoRef = type.slice(0,3).toUpperCase()+"-"+String(nM.current).padStart(3,"0");
    const nm = [...movements, {id:nM.current++,date:TODAY,type,productId:pId,locationId:lId,toLocationId:toLId,quantity:qty,reason,ref:ref||autoRef,user,chantierId:chId}];
    setLS(nls); setMovements(nm);
    saveAll(null,nm,null,nls,null,null);
    showToast("Mouvement enregistre !"); setModal(null); setForm({});
  };

  const handleAddProd = () => {
    if (!form.name||!form.sku||!form.category) return showToast("Champs obligatoires manquants","error");
    const newId = Date.now();
    const np = {id:newId, name:form.name, sku:form.sku, category:form.category, minStock:parseInt(form.minStock)||5, unit:form.unit||"unite"};
    const nprods = [...products, np];
    let nls = {...locationStock}, nm = [...movements];
    if (form.locationId && form.initQty && parseInt(form.initQty)>0) {
      nls[newId+"_"+form.locationId] = parseInt(form.initQty);
      nm = [...nm, {id:nM.current++,date:TODAY,type:"entree",productId:newId,locationId:parseInt(form.locationId),quantity:parseInt(form.initQty),reason:"Stock initial",ref:"INIT",user,chantierId:null}];
      setMovements(nm); setLS(nls);
    }
    setProducts(nprods); saveAll(nprods,nm,null,nls,null,null);
    showToast("Produit ajoute !"); setModal(null); setForm({});
  };

  const handleAddLoc = () => {
    if (!form.name||!form.code) return showToast("Remplissez tous les champs","error");
    const nl = [...locations, {id:nL.current++, name:form.name, code:form.code, color:form.color||"#888888"}];
    setLocations(nl); saveAll(null,null,nl,null,null,null);
    showToast("Lieu ajoute !"); setModal(null); setForm({});
  };

  const handleAddChantier = () => {
    if (!form.chName) return showToast("Entrez un nom de chantier","error");
    const nc = [...chantiers, {id:nC.current++, name:form.chName, adresse:form.chAdresse||"", statut:"en cours"}];
    setChantiers(nc); saveAll(null,null,null,null,null,nc);
    showToast("Chantier ajoute !"); setModal(null); setForm({});
  };

  const delProd = id => {
    const np = products.filter(p=>p.id!==id);
    const nls = {...locationStock}; Object.keys(nls).filter(k=>k.startsWith(id+"_")).forEach(k=>delete nls[k]);
    setProducts(np); setLS(nls); saveAll(np,null,null,nls,null,null);
    setModal(null); showToast("Produit supprime");
  };
  const delLoc = id => {
    if (Object.keys(locationStock).some(k=>k.endsWith("_"+id))) return showToast("Ce lieu contient des articles","error");
    const nl = locations.filter(l=>l.id!==id); setLocations(nl); saveAll(null,null,nl,null,null,null); showToast("Lieu supprime");
  };
  const delChantier = id => {
    const nc = chantiers.filter(c=>c.id!==id); setChantiers(nc); saveAll(null,null,null,null,null,nc); showToast("Chantier supprime");
  };
  const closeChantier = id => {
    const nc = chantiers.map(c=>c.id===id?{...c,statut:"termine"}:c); setChantiers(nc); saveAll(null,null,null,null,null,nc); showToast("Chantier cloture");
  };

  const exportCSV = () => {
    const rows = [["Produit","SKU","Categorie","Lieu","Quantite"]];
    products.forEach(p => locations.forEach(l => { const q=getLS2(p.id,l.id); if(q>0) rows.push([p.name,p.sku,p.category,l.name,q]); }));
    const b = new Blob(["﻿"+rows.map(r=>r.map(c=>'"'+c+'"').join(";")).join("\n")],{type:"text/csv;charset=utf-8;"});
    const a = document.createElement("a"); a.href=URL.createObjectURL(b); a.download="inventaire_"+TODAY+".csv"; a.click();
    showToast("Export CSV OK !");
  };
  const exportJSON = () => {
    const b = new Blob([JSON.stringify({products,movements,locations,locationStock,categories,chantiers},null,2)],{type:"application/json"});
    const a = document.createElement("a"); a.href=URL.createObjectURL(b); a.download="stockflow_"+TODAY+".json"; a.click();
    showToast("Export JSON OK !");
  };
  const importJSON = e => {
    const file = e.target.files[0]; if(!file) return;
    const r = new FileReader();
    r.onload = ev => {
      try {
        const d = JSON.parse(ev.target.result);
        if (d.products)      { setProducts(d.products);   nP.current=Math.max(...d.products.map(x=>x.id))+1; }
        if (d.movements)     { setMovements(d.movements);  nM.current=Math.max(...d.movements.map(x=>x.id))+1; }
        if (d.locations)     { setLocations(d.locations);  nL.current=Math.max(...d.locations.map(x=>x.id))+1; }
        if (d.locationStock)   setLS(d.locationStock);
        if (d.categories)      setCategories(d.categories);
        if (d.chantiers)     { setChantiers(d.chantiers);  nC.current=Math.max(...d.chantiers.map(x=>x.id))+1; }
        saveAll(d.products||products, d.movements||movements, d.locations||locations, d.locationStock||locationStock, d.categories||categories, d.chantiers||chantiers);
        showToast("Importe et synchronise !");
      } catch { showToast("Fichier invalide","error"); }
    };
    r.readAsText(file); e.target.value="";
  };
  const handleLogout = async () => { await window._fa.signOut(window._auth); onLogout(); };

  const tL = t => t==="entree"?"Entree":t==="sortie"?"Sortie":"Transfert";
  const tC = t => t==="entree"?"tin":t==="sortie"?"tout":"ttrf";

  if (!dbReady) return (
    <div style={{minHeight:"100vh",background:"#f5f5f3",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:16,fontFamily:"'DM Mono',monospace"}}>
      <style>{CSS}</style>
      <div style={{width:32,height:32,border:"2px solid #e0e0e0",borderTop:"2px solid #e8a000",borderRadius:"50%",animation:"spin 1s linear infinite"}}/>
      <span style={{fontSize:13,color:"#aaa"}}>Chargement...</span>
    </div>
  );

  return (
    <div style={{fontFamily:"'DM Mono',monospace",background:"#f5f5f3",minHeight:"100vh",color:"#1a1a1a"}}>
      <style>{CSS}</style>

      <header style={{borderBottom:"1px solid #e8e8e8",padding:"0 24px",display:"flex",alignItems:"center",justifyContent:"space-between",background:"#fff",flexWrap:"wrap",gap:8}}>
        <div style={{display:"flex",alignItems:"center",gap:16}}>
          <div style={{padding:"14px 0",display:"flex",alignItems:"center",gap:10}}>
            <div style={{width:26,height:26,background:"#e8a000",borderRadius:3,display:"flex",alignItems:"center",justifyContent:"center"}}>
              <span style={{fontSize:13,fontWeight:700,color:"#fff"}}>S</span>
            </div>
            <div>
              <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:13,letterSpacing:".1em"}}>STOCKFLOW</div>
              <div style={{fontSize:10,color:"#aaa"}}>Marmottan TP</div>
            </div>
          </div>
          <nav style={{display:"flex",flexWrap:"wrap"}}>
            {["dashboard","inventaire","mouvements","lieux","categories","chantiers"].map(v=>(
              <button key={v} className={"nb"+(view===v?" a":"")} onClick={()=>setView(v)}>
                {v.charAt(0).toUpperCase()+v.slice(1)}
              </button>
            ))}
          </nav>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8,padding:"8px 0",flexWrap:"wrap"}}>
          {syncing
            ? <span className="syncing" style={{fontSize:11,color:"#c07800"}}>Sauvegarde...</span>
            : lastSync && <span style={{fontSize:11,color:"#3d9e6a"}}>Sync. {lastSync.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}</span>
          }

          <button className="bo" onClick={()=>{setForm({type:"sortie"});setModal("movement");}}>- Sortie</button>
          <button className="bp" onClick={()=>{setForm({type:"entree"});setModal("movement");}}>+ Entree</button>
          <button className="bg" onClick={handleLogout} style={{color:"#d05040"}}>Deconnexion</button>
        </div>
      </header>

      <main style={{padding:"24px 28px",maxWidth:1280,margin:"0 auto"}} className="fi">

        {view==="dashboard" && (
          <div>
            <div style={{marginBottom:24}}>
              <h1 style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:24,marginBottom:3}}>Tableau de bord</h1>
              <p style={{color:"#888",fontSize:13}}>{TODAY} — {locations.length} lieux — {products.length} references</p>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12,marginBottom:24}}>
              {[
                {label:"References",value:products.length,sub:"produits actifs",c:"y"},
                {label:"Alertes stock",value:lowStock.length,sub:"sous le seuil",c:"r"},
                {label:"Mouvements",value:todayMov.length,sub:"aujourd'hui",c:"b"}
              ].map(s=>(
                <div key={s.label} className={"sc "+s.c}>
                  <div style={{fontSize:10,color:"#aaa",letterSpacing:".1em",textTransform:"uppercase",marginBottom:8}}>{s.label}</div>
                  <div style={{fontFamily:"'Syne',sans-serif",fontSize:26,fontWeight:700,marginBottom:4}}>{s.value}</div>
                  <div style={{fontSize:12,color:"#aaa"}}>{s.sub}</div>
                </div>
              ))}
            </div>
            <div style={{marginBottom:20}}>
              <h2 style={{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:14,marginBottom:12}}>Repartition par lieu</h2>
              <div style={{display:"grid",gridTemplateColumns:"repeat("+Math.min(locations.length,3)+",1fr)",gap:10}}>
                {locations.map(loc=>{
                  const items = products.reduce((a,p)=>a+getLS2(p.id,loc.id),0);
                  return (
                    <div key={loc.id} className="card" style={{padding:16,borderLeft:"3px solid "+loc.color}}>
                      <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
                        <div>
                          <div style={{fontWeight:500,fontSize:14}}>{loc.name}</div>
                          <div style={{fontSize:11,color:"#aaa",marginTop:2}}>{loc.code}</div>

                        <span style={{background:loc.color+"15",border:"1px solid "+loc.color+"30",color:loc.color,fontSize:11,padding:"2px 7px",borderRadius:2,height:"fit-content"}}>{items} art.</span>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:18}}>
              <div className="card" style={{padding:20}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
                  <h2 style={{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:14}}>Alertes de stock</h2>
                  {lowStock.length>0 && <span className="blow">{lowStock.length} alerte{lowStock.length>1?"s":""}</span>}
                </div>
                {lowStock.length===0
                  ? <p style={{color:"#aaa",fontSize:13,textAlign:"center",padding:"16px 0"}}>Tous les stocks sont suffisants</p>

                    <div key={p.id} style={{marginBottom:12,paddingBottom:12,borderBottom:"1px solid #f0f0f0"}}>
                      <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}>
                        <div>
                          <span style={{fontSize:13,fontWeight:500}}>{p.name}</span>
                          <span style={{fontSize:11,background:"#e8f0fb",color:"#2E75B6",padding:"1px 7px",borderRadius:2,marginLeft:8}}>{p.category}</span>
                        </div>
                        <span style={{color:"#d05040",fontWeight:500}}>{p.quantity}/{p.minStock}</span>
                      </div>
                      <div className="pb"><div className="pf" style={{width:Math.min(100,(p.quantity/p.minStock)*100)+"%",background:p.quantity===0?"#d05040":"#f0a040"}}/></div>
                    </div>
                  ))
                }
              </div>
              <div className="card" style={{padding:20}}>
                <h2 style={{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:14,marginBottom:16}}>Derniers mouvements</h2>
                {[...movements].reverse().slice(0,5).map(m=>(
                  <div key={m.id} style={{display:"flex",alignItems:"center",gap:8,marginBottom:10,paddingBottom:10,borderBottom:"1px solid #f0f0f0"}}>
                    <span className={tC(m.type)}>{tL(m.type)}</span>
                    <div style={{flex:1}}>
                      <div style={{fontSize:13}}>{getPN(m.productId)}</div>
                      <div style={{fontSize:11,color:"#aaa"}}>{getLN(m.locationId)}{m.toLocationId?" > "+getLN(m.toLocationId):""}{m.chantierId?" — "+getCHN(m.chantierId):""}</div>
                    </div>
                    <div style={{textAlign:"right"}}>
                      <div style={{fontFamily:"'Syne',sans-serif",fontWeight:600,color:m.type==="entree"?"#3d9e6a":m.type==="transfert"?"#4a7acc":"#d05040"}}>
                        {m.type==="entree"?"+":m.type==="transfert"?">>":"-"}{m.quantity}
                      </div>
                      <div style={{fontSize:11,color:"#aaa"}}>{m.date}</div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}

        {view==="inventaire" && (
          <div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:20}}>
              <div>
                <h1 style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:24,marginBottom:3}}>Inventaire</h1>
                <p style={{color:"#888",fontSize:13}}>{fil.length} references</p>
              </div>
              <div style={{display:"flex",gap:8}}>
                <button className="bg" onClick={exportCSV}>Export CSV</button>
                <button className="bp" onClick={()=>{setForm({});setModal("add-product");}}>+ Nouveau produit</button>
              </div>
            </div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}>
              {["Tous",...categories].map(c=>(
                <span key={c} className={"cat-chip"+(filterCat===c?" active":"")} onClick={()=>setFilterCat(c)}>{c}</span>
              ))}
            </div>
            <div style={{display:"flex",gap:10,marginBottom:14,flexWrap:"wrap"}}>
              <input className="if" placeholder="Rechercher..." value={search} onChange={e=>setSearch(e.target.value)} style={{flex:1,minWidth:180}}/>
              <select className="if" value={filterLoc} onChange={e=>setFilterLoc(e.target.value)} style={{width:175}}>
                <option value="Tous">Tous les lieux</option>
                {locations.map(l=><option key={l.id} value={l.id}>{l.name}</option>)}
              </select>
              <select className="if" value={sortBy} onChange={e=>setSortBy(e.target.value)} style={{width:165}}>
                <option value="name">Tri : Nom A-Z</option>
                <option value="nameDesc">Tri : Nom Z-A</option>
                <option value="quantity">Tri : Stock haut</option>
                <option value="quantityAsc">Tri : Stock bas</option>
                <option value="category">Tri : Categorie</option>
                <option value="status">Tri : Alerte</option>
              </select>
            </div>
            <div className="card">
              <table>
                <thead>
                  <tr><th>Produit</th><th>SKU</th><th>Categorie</th><th>Lieux</th><th>Total</th><th>Statut</th><th></th></tr>
                </thead>
                <tbody>
                  {fil.map(p=>{
                    const r = p.quantity/p.minStock;
                    const st = p.quantity===0?"rupture":r<=1?"critique":r<=1.5?"bas":"ok";
                    return (
                      <tr key={p.id} style={{cursor:"pointer"}} onClick={()=>setModal({type:"product-detail",data:p})}>
                        <td style={{fontWeight:500}}>{p.name}</td>
                        <td style={{color:"#888",fontSize:12}}>{p.sku}</td>
                        <td style={{color:"#888",fontSize:12}}>{p.category}</td>
                        <td>
                          <div style={{display:"flex",flexWrap:"wrap",gap:2}}>
                            {locations.map(l=>{const q=getLS2(p.id,l.id);if(!q)return null;return <span key={l.id} className="lp" style={{background:l.color+"18",border:"1px solid "+l.color+"35",color:l.color}}>{l.code} <b>{q}</b></span>;})}
                            {locations.every(l=>!getLS2(p.id,l.id)) && <span style={{color:"#ccc",fontSize:11}}>--</span>}
                          </div>
                        </td>
                        <td><span style={{fontFamily:"'Syne',sans-serif",fontWeight:600}}>{p.quantity}</span> <span style={{color:"#aaa",fontSize:11}}>{p.unit}</span></td>
                        <td><span className={st==="ok"?"bok":st==="bas"?"bwn":"blow"}>{st==="ok"?"OK":st==="bas"?"Bas":st==="critique"?"Critique":"Rupture"}</span></td>
                        <td onClick={e=>e.stopPropagation()}>
                          <div style={{display:"flex",gap:2}}>
                            <button className="rb" onClick={()=>{setForm({type:"entree",productId:String(p.id)});setModal("movement");}}>+</button>
                            <button className="rb" onClick={()=>{setForm({type:"sortie",productId:String(p.id)});setModal("movement");}}>-</button>
                            <button className="rb" onClick={()=>{setForm({type:"transfert",productId:String(p.id)});setModal("movement");}}>~</button>
                          </div>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
              {fil.length===0 && <p style={{textAlign:"center",color:"#ccc",padding:"32px",fontSize:13}}>Aucun produit trouve.</p>}
            </div>
          </div>
        )}

        {view==="mouvements" && (
          <div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:20}}>
              <div>
                <h1 style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:24,marginBottom:3}}>Mouvements</h1>
                <p style={{color:"#888",fontSize:13}}>{movements.length} operations</p>
              </div>
              <div style={{display:"flex",gap:8}}>
                <button className="bo" onClick={()=>{setForm({type:"sortie"});setModal("movement");}}>- Sortie</button>
                <button className="bo" onClick={()=>{setForm({type:"transfert"});setModal("movement");}}>Transfert</button>
                <button className="bp" onClick={()=>{setForm({type:"entree"});setModal("movement");}}>+ Entree</button>
              </div>
            </div>
            <div className="card">
              <table>
                <thead><tr><th>Date</th><th>Type</th><th>Produit</th><th>Lieu</th><th>Qte</th><th>Chantier</th><th>Ref</th><th>Motif</th><th>Operateur</th></tr></thead>
                <tbody>
                  {[...movements].reverse().map(m=>(
                    <tr key={m.id}>
                      <td style={{color:"#888",fontSize:12}}>{m.date}</td>
                      <td><span className={tC(m.type)}>{tL(m.type)}</span></td>
                      <td style={{fontWeight:500}}>{getPN(m.productId)}</td>
                      <td>
                        <div style={{display:"flex",alignItems:"center",gap:5,flexWrap:"wrap"}}>
                          <span style={{width:6,height:6,borderRadius:"50%",background:getLC(m.locationId),display:"inline-block",flexShrink:0}}/>
                          <span style={{fontSize:12,color:"#888"}}>{getLN(m.locationId)}</span>
                          {m.toLocationId && <><span style={{color:"#ccc"}}>&gt;</span><span style={{width:6,height:6,borderRadius:"50%",background:getLC(m.toLocationId),display:"inline-block"}}/><span style={{fontSize:12,color:"#888"}}>{getLN(m.toLocationId)}</span></>}
                        </div>
                      </td>
                      <td><span style={{fontFamily:"'Syne',sans-serif",fontWeight:600,color:m.type==="entree"?"#3d9e6a":m.type==="transfert"?"#4a7acc":"#d05040"}}>{m.type==="entree"?"+":m.type==="transfert"?">>":"-"}{m.quantity}</span></td>
                      <td style={{fontSize:12,color:"#4a7acc"}}>{m.chantierId ? getCHN(m.chantierId) : "--"}</td>
                      <td style={{color:"#888",fontSize:12}}>{m.ref}</td>
                      <td style={{color:"#aaa",fontSize:12}}>{m.reason}</td>
                      <td style={{color:"#aaa",fontSize:12}}>{m.user.split("@")[0]}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        )}

        {view==="lieux" && (
          <div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:20}}>
              <div>
                <h1 style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:24,marginBottom:3}}>Lieux de stockage</h1>
                <p style={{color:"#888",fontSize:13}}>{locations.length} emplacements</p>
              </div>
              <button className="bp" onClick={()=>{setForm({color:LOC_COLORS[locations.length%LOC_COLORS.length]});setModal("add-location");}}>+ Nouveau lieu</button>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat("+Math.min(locations.length,3)+",1fr)",gap:14}}>
              {locations.map(loc=>{
                const lP = products.filter(p=>getLS2(p.id,loc.id)>0);
                const lI = lP.reduce((a,p)=>a+getLS2(p.id,loc.id),0);
                return (
                  <div key={loc.id} className="card" style={{padding:20,borderTop:"3px solid "+loc.color}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
                      <div>
                        <div style={{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:15}}>{loc.name}</div>
                        <div style={{fontSize:11,color:"#aaa",marginTop:2}}>{loc.code}</div>
                      </div>
                      <button className="bsm" onClick={()=>delLoc(loc.id)}>Suppr.</button>
                    </div>
                    <div style={{background:"#f8f8f6",padding:10,borderRadius:2,marginBottom:12,display:"inline-block"}}>
                      <div style={{fontSize:10,color:"#aaa",textTransform:"uppercase"}}>Articles en stock</div>
                      <div style={{fontFamily:"'Syne',sans-serif",fontWeight:600,fontSize:17,marginTop:3}}>{lI}</div>

                      <div key={p.id} style={{display:"flex",justifyContent:"space-between",padding:"4px 0",borderBottom:"1px solid #f0f0f0",fontSize:12}}>
                        <span style={{color:"#555"}}>{p.name}</span>
                        <span style={{color:loc.color,fontWeight:500}}>{getLS2(p.id,loc.id)} {p.unit}</span>
                      </div>

                    {lP.length===0 && <p style={{color:"#ccc",fontSize:12}}>Aucun produit</p>}
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {view==="categories" && (
          <div>
            <div style={{marginBottom:20}}>
              <h1 style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:24,marginBottom:3}}>Categories</h1>

            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:22}}>
              <div className="card" style={{overflow:"hidden"}}>
                <div style={{padding:"13px 16px",borderBottom:"1px solid #f0f0f0",display:"flex",justifyContent:"space-between"}}>
                  <span style={{fontSize:12,color:"#888",textTransform:"uppercase",letterSpacing:".08em"}}>Existantes</span>
                  <span style={{fontSize:11,color:"#aaa"}}>{categories.length} entrees</span>
                </div>
                {categories.map((cat,i)=>{
                  const count = products.filter(p=>p.category===cat).length;
                  const isR = catRen[i]!==undefined;
                  return (
                    <div key={cat} className="cat-row">

        const p = modal.data;
        return (
          <div className="ov" onClick={()=>setModal(null)}>
            <div className="mb" onClick={e=>e.stopPropagation()}>
              <h2 style={{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:18,marginBottom:6}}>Modifier le produit</h2>
              <p style={{color:"#aaa",fontSize:12,marginBottom:20}}>{p.sku}</p>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:13}}>
                {[{label:"Nom *",field:"editName",def:p.name,full:true},{label:"SKU *",field:"editSku",def:p.sku},{label:"Stock min.",field:"editMinStock",def:String(p.minStock),type:"number"},{label:"Unite",field:"editUnit",def:p.unit}].map(f=>(
                  <div key={f.field} style={{gridColumn:f.full?"1/-1":"auto"}}>
                    <label style={{display:"block",fontSize:11,color:"#888",marginBottom:5,textTransform:"uppercase",letterSpacing:".08em"}}>{f.label}</label>
                    <input className="if" type={f.type||"text"} defaultValue={f.def} onChange={e=>setForm(ff=>({...ff,editId:p.id,[f.field]:e.target.value}))} onFocus={e=>{if(!form[f.field])setForm(ff=>({...ff,editId:p.id,[f.field]:f.def}));}}/>
                  </div>
                ))}
                <div>
                  <label style={{display:"block",fontSize:11,color:"#888",marginBottom:5,textTransform:"uppercase",letterSpacing:".08em"}}>Categorie *</label>
                  <select className="if" defaultValue={p.category} onChange={e=>setForm(ff=>({...ff,editId:p.id,editCategory:e.target.value}))}>
                    {categories.map(c=><option key={c} value={c}>{c}</option>)}
                  </select>
                </div>
              </div>
              <div style={{display:"flex",gap:10,marginTop:20}}>
                <button className="bo" style={{flex:1}} onClick={()=>setModal(null)}>Annuler</button>
                <button className="bp" style={{flex:2}} onClick={()=>{
                  const updated = products.map(pr=>pr.id===p.id?{...pr,
                    name:form.editName||p.name,
                    sku:form.editSku||p.sku,
                    category:form.editCategory||p.category,
                    minStock:parseInt(form.editMinStock)||p.minStock,
                    unit:form.editUnit||p.unit
                  }:pr);
                  setProducts(updated);
                  saveAll(updated,null,null,null,null,null);
                  showToast("Produit modifie !"); setModal(null); setForm({});
                }}>Enregistrer</button>
              </div>
            </div>
          </div>
        );
      })()}

      {toast && <div className={"toast "+toast.type}>{toast.type==="success"?"OK":"ERR"} — {toast.msg}</div>}
    </div>
  );
}

function App() {
  const [user, setUser]       = useState(null);
  const [checking, setChecking] = useState(true);
  useEffect(()=>{
    const init = async () => {
      if (!window._fbReady) await new Promise(r=>window.addEventListener("fb-ready",r,{once:true}));
      window._fa.onAuthStateChanged(window._auth, u => { setUser(u?u.email:null); setChecking(false); });
    };
    init();
  },[]);
  if (checking) return (
    <div style={{minHeight:"100vh",background:"#f5f5f3",display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{width:32,height:32,border:"2px solid #e0e0e0",borderTop:"2px solid #e8a000",borderRadius:"50%",animation:"spin 1s linear infinite"}}/>
      <style>{"@keyframes spin{to{transform:rotate(360deg)}}"}</style>
    </div>
  );
  if (!user) return <LoginScreen onLogin={setUser}/>;
  return <StockApp user={user} onLogout={()=>setUser(null)}/>;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
