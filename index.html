const CSS = `
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@700;800&display=swap');

/* === MODAL MOBILE (slide from bottom) === */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:100}

/* === TABLEAUX MOBILE : remplacés par des cartes === */
.mob-list{display:flex;flex-direction:column;gap:8px;padding:12px 16px}

/* === TOAST === */

function LoginScreen({onLogin}) {
  const [email, setEmail] = useState("");
  const [pass, setPass] = useState("");
  const [err, setErr] = useState("");
  const [loading, setLoading] = useState(false);
  const login = async () => {
    if (!email||!pass){setErr("Email et mot de passe requis");return;}
    if (!USERS.includes(email)){setErr("Email non autorise");return;}
    setLoading(true);setErr("");
    try{
      await window._fa.signInWithEmailAndPassword(window._auth,email,pass);
      onLogin(email);
    }catch(e){setErr(e.code==="auth/wrong-password"||e.code==="auth/user-not-found"?"Identifiants incorrects":"Erreur : "+e.message);}
    setLoading(false);
  };
  return (
    <div className="login-wrap">
      <style>{CSS}</style>
      <div className="login-card">
        <div style={{marginBottom:28,textAlign:"center"}}>
          <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:24,letterSpacing:"-0.02em",color:"#1a1a1a"}}>StockFlow</div>
          <div style={{fontSize:12,color:"#aaa",fontFamily:"'DM Mono',monospace",marginTop:4}}>Marmottan TP</div>
        </div>
        <div style={{marginBottom:14}}>
          <label style={{display:"block",fontSize:11,color:"#888",marginBottom:6,textTransform:"uppercase",letterSpacing:".08em",fontFamily:"'DM Mono',monospace"}}>Email</label>
          <input className="if" type="email" autoCapitalize="none" autoCorrect="off" value={email} onChange={e=>setEmail(e.target.value)} placeholder="vous@marmottantp.fr" onKeyDown={e=>e.key==="Enter"&&login()}/>
        </div>
        <div style={{marginBottom:20}}>
          <label style={{display:"block",fontSize:11,color:"#888",marginBottom:6,textTransform:"uppercase",letterSpacing:".08em",fontFamily:"'DM Mono',monospace"}}>Mot de passe</label>
          <input className="if" type="password" value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&login()}/>
        </div>
        {err && <p style={{color:"#d05040",fontSize:12,marginBottom:12,fontFamily:"'DM Mono',monospace"}}>{err}</p>}
        <button className="bp" style={{width:"100%"}} onClick={login} disabled={loading}>
          {loading ? "Connexion..." : "Se connecter"}
        </button>
      </div>
    </div>
  );
}

function StockApp({user, onLogout}) {
  const [tab, setTab] = useState("dashboard");
  const [products, setProducts] = useState(DEF_PRODS);
  const [movements, setMovements] = useState(DEF_MOVS);
  const [locations, setLocations] = useState(DEF_LOCS);
  const [locStocks, setLocStocks] = useState(DEF_LS);
  const [categories, setCategories] = useState(DEF_CATS);
  const [chantiers, setChantiers] = useState(DEF_CHANTIERS);
  const [modal, setModal] = useState(null);
  const [form, setForm] = useState({});
  const [toast, setToast] = useState(null);
  const [syncing, setSyncing] = useState(false);
  const [search, setSearch] = useState("");
  const [catFilter, setCatFilter] = useState("Tous");

  const showToast = (msg, type="success") => {
    setToast({msg,type});
    setTimeout(()=>setToast(null),2800);
  };

  const saveAll = useCallback(async (p,m,l,ls,cats,ch) => {
    if (!window._db) return;
    setSyncing(true);
    try {
      await window._fs.setDoc(window._fs.doc(window._db,"stockflow","data"),{
        products:p||products, movements:m||movements, locations:l||locations,
        locStocks:ls||locStocks, categories:cats||categories, chantiers:ch||chantiers
      });
    } catch(e){showToast("Erreur sync","error");}
    setSyncing(false);
  },[products,movements,locations,locStocks,categories,chantiers]);

  useEffect(()=>{
    if(!window._db) return;
    const unsub = window._fs.onSnapshot(window._fs.doc(window._db,"stockflow","data"), snap=>{
      if(snap.exists()){
        const d=snap.data();
        if(d.products) setProducts(d.products);
        if(d.movements) setMovements(d.movements);
        if(d.locations) setLocations(d.locations);
        if(d.locStocks) setLocStocks(d.locStocks);
        if(d.categories) setCategories(d.categories);
        if(d.chantiers) setChantiers(d.chantiers);
      }
    });
    return ()=>unsub();
  },[]);

  const getTotalStock = (pid) => locations.reduce((s,l)=>{
    const v = locStocks[pid+"_"+l.id];
    return s+(v||0);
  },0);

  const getStockStatus = (p) => {
    const t = getTotalStock(p.id);
    if(t===0) return "low";
    if(t<=p.minStock) return "warn";
    return "ok";
  };

  const getLN = (id) => locations.find(l=>l.id===id)?.name||"?";
  const getCHN = (id) => id ? (chantiers.find(c=>c.id===id)?.name||"?") : null;

  const tC = (t) => t==="entree"?"tin":t==="transfert"?"ttrf":"tout";
  const tL = (t) => t==="entree"?"+ Entree":t==="transfert"?">> Transf.":"- Sortie";

  const addMovement = () => {
    const {type,productId,locationId,toLocationId,quantity,reason,ref,chantierId} = form;
    if(!type||!productId||!locationId||!quantity) return showToast("Champs manquants","error");
    const pid=parseInt(productId), lid=parseInt(locationId), qty=parseInt(quantity);
    if(isNaN(pid)||isNaN(lid)||isNaN(qty)||qty<=0) return showToast("Donnees invalides","error");

    const key = pid+"_"+lid;
    const cur = locStocks[key]||0;
    if((type==="sortie"||type==="transfert") && cur < qty) return showToast("Stock insuffisant","error");

    const newLS = {...locStocks};
    if(type==="entree") newLS[key]=(cur+qty);
    else if(type==="sortie") newLS[key]=Math.max(0,cur-qty);
    else if(type==="transfert") {
      const toLid=parseInt(toLocationId);
      if(!toLid||toLid===lid) return showToast("Destination invalide","error");
      const toKey=pid+"_"+toLid;
      newLS[key]=Math.max(0,cur-qty);
      newLS[toKey]=(newLS[toKey]||0)+qty;
    }

    const newM = [...movements, {
      id:Date.now(),date:TODAY,type,productId:pid,locationId:lid,
      toLocationId:type==="transfert"?parseInt(toLocationId):null,
      quantity:qty,reason:reason||"",ref:ref||"",
      user,chantierId:chantierId?parseInt(chantierId):null
    }];

    setLocStocks(newLS);
    setMovements(newM);
    saveAll(null,newM,null,newLS,null,null);
    showToast(type==="entree"?"Entree enregistree !":type==="sortie"?"Sortie enregistree !":"Transfert effectue !");
    setModal(null);setForm({});
  };

  const delProd = (id) => {
    const np = products.filter(p=>p.id!==id);
    setProducts(np);
    saveAll(np,null,null,null,null,null);
    showToast("Produit supprime.");
    setModal(null);
  };

  // === DASHBOARD ===
  const renderDashboard = () => {
    const lowStock = products.filter(p=>getStockStatus(p)!=="ok");
    const recentMovs = [...movements].reverse().slice(0,5);
    const totalProds = products.length;
    const totalMovs = movements.length;

    return (
      <div className="fi">
        <div style={{padding:"16px 16px 8px"}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            {[
              {label:"Produits",val:totalProds,color:"b"},
              {label:"Mouvements",val:totalMovs,color:"y"},
              {label:"Alertes stock",val:lowStock.length,color:lowStock.length>0?"r":"g"},
              {label:"Entrepots",val:locations.length,color:"b"}
            ].map(s=>(
              <div key={s.label} className={"sc "+s.color} style={{padding:"14px 16px"}}>
                <div style={{fontSize:10,color:"#aaa",textTransform:"uppercase",letterSpacing:".06em",marginBottom:6,fontFamily:"'DM Mono',monospace"}}>{s.label}</div>
                <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:28}}>{s.val}</div>
              </div>
            ))}
          </div>
        </div>

        {lowStock.length > 0 && (
          <div style={{padding:"8px 16px"}}>
            <div style={{fontSize:11,color:"#aaa",textTransform:"uppercase",letterSpacing:".08em",marginBottom:8,fontFamily:"'DM Mono',monospace"}}>Alertes stock</div>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {lowStock.map(p=>{
                const t=getTotalStock(p.id);
                const st=getStockStatus(p);
                return (
                  <div key={p.id} className="card" style={{padding:"12px 14px",display:"flex",justifyContent:"space-between",alignItems:"center"}}
                    onClick={()=>setModal({type:"product-detail",data:p})}>
                    <div>
                      <div style={{fontFamily:"'DM Mono',monospace",fontSize:13,fontWeight:500}}>{p.name}</div>
                      <div style={{fontSize:11,color:"#aaa",fontFamily:"'DM Mono',monospace",marginTop:2}}>min. {p.minStock} {p.unit}</div>
                    </div>
                    <span className={st==="low"?"blow":"bwn"}>{t} {p.unit}</span>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        <div style={{padding:"8px 16px"}}>
          <div style={{fontSize:11,color:"#aaa",textTransform:"uppercase",letterSpacing:".08em",marginBottom:8,fontFamily:"'DM Mono',monospace"}}>Derniers mouvements</div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {recentMovs.map(m=>{
              const p=products.find(p=>p.id===m.productId);
              return (
                <div key={m.id} className="card" style={{padding:"12px 14px",display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:4}}>
                      <span className={tC(m.type)}>{tL(m.type)}</span>
                      <span style={{fontFamily:"'DM Mono',monospace",fontSize:12,color:"#555",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p?.name||"?"}</span>
                    </div>
                    <div style={{fontSize:11,color:"#aaa",fontFamily:"'DM Mono',monospace"}}>{getLN(m.locationId)} — {m.date}</div>
                  </div>
                  <div style={{color:m.type==="entree"?"#3d9e6a":m.type==="transfert"?"#4a7acc":"#d05040",fontWeight:600,fontFamily:"'Syne',sans-serif",fontSize:15,marginLeft:8}}>
                    {m.type==="entree"?"+":m.type==="transfert"?">>":"-"}{m.quantity}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    );
  };

  // === PRODUITS ===
  const renderProduits = () => {
    const filtered = products.filter(p=>{
      const matchS = !search || p.name.toLowerCase().includes(search.toLowerCase()) || p.sku.toLowerCase().includes(search.toLowerCase());
      const matchC = catFilter==="Tous" || p.category===catFilter;
      return matchS && matchC;
    });

    return (
      <div className="fi">
        <div className="search-bar">
          <input type="search" placeholder="Rechercher produit, SKU..." value={search} onChange={e=>setSearch(e.target.value)}/>
        </div>
        <div className="chips-bar">
          {["Tous",...categories].map(c=>(
            <button key={c} className={"cat-chip"+(catFilter===c?" active":"")} onClick={()=>setCatFilter(c)}>{c}</button>
          ))}
        </div>
        <div className="mob-list">
          {filtered.map(p=>{
            const total=getTotalStock(p.id);
            const st=getStockStatus(p);
            return (
              <div key={p.id} className="mob-row" onClick={()=>setModal({type:"product-detail",data:p})}>
                <div className="mob-row-header">
                  <div style={{fontFamily:"'DM Mono',monospace",fontSize:14,fontWeight:500,color:"#1a1a1a"}}>{p.name}</div>
                  <span className={st==="ok"?"bok":st==="warn"?"bwn":"blow"}>{total} {p.unit}</span>
                </div>
                <div className="mob-row-meta">
                  <span style={{fontSize:11,color:"#aaa",fontFamily:"'DM Mono',monospace"}}>{p.sku}</span>
                  <span style={{fontSize:11,color:"#bbb"}}>·</span>
                  <span style={{fontSize:11,color:"#888",fontFamily:"'DM Mono',monospace"}}>{p.category}</span>
                </div>
                <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:2}}>
                  {locations.map(l=>{
                    const q=locStocks[p.id+"_"+l.id]||0;
                    return q>0 ? (
                      <span key={l.id} className="lp" style={{background:l.color+"22",color:l.color,border:"1px solid "+l.color+"44"}}>
                        {l.code}: {q}
                      </span>
                    ) : null;
                  })}
                </div>
              </div>
            );
          })}
          {filtered.length===0 && <div style={{textAlign:"center",color:"#aaa",fontFamily:"'DM Mono',monospace",fontSize:12,padding:32}}>Aucun produit</div>}
        </div>
      </div>
    );
  };

  // === MOUVEMENTS ===
  const renderMouvements = () => {
    const filtered = [...movements].reverse().filter(m=>{
      if(!search) return true;
      const p=products.find(p=>p.id===m.productId);
      return (p?.name||"").toLowerCase().includes(search.toLowerCase()) || (m.reason||"").toLowerCase().includes(search.toLowerCase()) || (m.ref||"").toLowerCase().includes(search.toLowerCase());
    });

    return (
      <div className="fi">
        <div className="search-bar">
          <input type="search" placeholder="Rechercher..." value={search} onChange={e=>setSearch(e.target.value)}/>
        </div>
        <div className="mob-list">
          {filtered.map(m=>{
            const p=products.find(p=>p.id===m.productId);
            return (
              <div key={m.id} className="mob-row" style={{cursor:"default"}}>
                <div className="mob-row-header">
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontFamily:"'DM Mono',monospace",fontSize:13,fontWeight:500,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p?.name||"?"}</div>
                    <div style={{fontSize:11,color:"#aaa",fontFamily:"'DM Mono',monospace",marginTop:2}}>{m.date} — {m.ref||"sans ref."}</div>
                  </div>
                  <div style={{color:m.type==="entree"?"#3d9e6a":m.type==="transfert"?"#4a7acc":"#d05040",fontWeight:700,fontFamily:"'Syne',sans-serif",fontSize:18,marginLeft:8}}>
                    {m.type==="entree"?"+":m.type==="transfert"?"↔":"-"}{m.quantity}
                  </div>
                </div>
                <div className="mob-row-meta">
                  <span className={tC(m.type)}>{tL(m.type)}</span>
                  <span style={{fontSize:11,color:"#888",fontFamily:"'DM Mono',monospace"}}>{getLN(m.locationId)}{m.toLocationId?" → "+getLN(m.toLocationId):""}</span>
                </div>
                {m.reason && <div style={{fontSize:12,color:"#777",fontFamily:"'DM Mono',monospace"}}>{m.reason}{m.chantierId?" — "+getCHN(m.chantierId):""}</div>}
              </div>
            );
          })}
          {filtered.length===0 && <div style={{textAlign:"center",color:"#aaa",fontFamily:"'DM Mono',monospace",fontSize:12,padding:32}}>Aucun mouvement</div>}
        </div>
      </div>
    );
  };

  // === LIEUX ===
  const renderLieux = () => (
    <div className="fi">
      <div className="mob-list">
        {locations.map(l=>{
          const total = products.reduce((s,p)=>s+(locStocks[p.id+"_"+l.id]||0),0);
          const nbProds = products.filter(p=>(locStocks[p.id+"_"+l.id]||0)>0).length;
          return (
            <div key={l.id} className="card" style={{padding:"16px",borderLeft:`3px solid ${l.color}`}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
                <div>
                  <div style={{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:15}}>{l.name}</div>
                  <div style={{fontSize:11,color:"#aaa",fontFamily:"'DM Mono',monospace",marginTop:2}}>{l.code}</div>
                </div>
                <div style={{textAlign:"right"}}>
                  <div style={{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:20,color:l.color}}>{total}</div>
                  <div style={{fontSize:11,color:"#aaa",fontFamily:"'DM Mono',monospace"}}>unites / {nbProds} refs</div>
                </div>
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:8}}>
                {products.filter(p=>(locStocks[p.id+"_"+l.id]||0)>0).map(p=>{
                  const q=locStocks[p.id+"_"+l.id]||0;
                  const max=p.minStock*3||1;
                  const pct=Math.min(100,Math.round(q/max*100));
                  return (
                    <div key={p.id} style={{display:"flex",alignItems:"center",gap:10}}>
                      <span style={{fontFamily:"'DM Mono',monospace",fontSize:11,color:"#666",flex:"0 0 140px",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.name}</span>
                      <div className="pb" style={{flex:1}}><div className="pf" style={{width:pct+"%",background:l.color}}/></div>
                      <span style={{fontFamily:"'Syne',sans-serif",fontWeight:500,fontSize:13,minWidth:40,textAlign:"right"}}>{q}</span>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );

  // === CHANTIERS ===
  const renderChantiers = () => (
    <div className="fi">
      <div className="mob-list">
        {chantiers.map(c=>{
          const movs = movements.filter(m=>m.chantierId===c.id);
          return (
            <div key={c.id} className="card" style={{padding:"16px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                <div style={{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:15}}>{c.name}</div>
                <span className={c.statut==="en cours"?"bwn":"bok"}>{c.statut}</span>
              </div>
              <div style={{fontSize:12,color:"#888",fontFamily:"'DM Mono',monospace",marginBottom:10}}>{c.adresse}</div>
              {movs.length > 0 && (
                <div style={{fontSize:11,color:"#aaa",fontFamily:"'DM Mono',monospace"}}>{movs.length} mouvement(s) associe(s)</div>
              )}
              <div style={{display:"flex",gap:8,marginTop:12}}>
                <button className="tout" style={{fontSize:12,padding:"6px 12px",border:"1px solid #f5c0bb",borderRadius:6,background:"#fdecea",cursor:"pointer",fontFamily:"'DM Mono',monospace"}}
                  onClick={()=>{setForm({type:"sortie",chantierId:String(c.id)});setModal("movement");}}>
                  Sortie chantier
                </button>
              </div>
            </div>
          );
        })}
        {chantiers.length===0 && <div style={{textAlign:"center",color:"#aaa",fontFamily:"'DM Mono',monospace",fontSize:12,padding:32}}>Aucun chantier</div>}
      </div>
    </div>
  );

  // === MODAL MOUVEMENT ===
  const renderModalMouvement = () => (
    <div className="ov" onClick={()=>setModal(null)}>
      <div className="mb" onClick={e=>e.stopPropagation()}>
        <div className="mb-handle"/>
        <h2 style={{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:18,marginBottom:20}}>Nouveau mouvement</h2>
        <div style={{display:"flex",gap:8,marginBottom:16}}>
          {["entree","sortie","transfert"].map(t=>(
            <button key={t} onClick={()=>setForm(f=>({...f,type:t}))}
              className={form.type===t?"bp":"bo"} style={{flex:1,padding:"10px 4px",fontSize:12}}>
              {t==="entree"?"+ Entree":t==="sortie"?"- Sortie":">> Transfert"}
            </button>
          ))}
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:14}}>
          {[
            {label:"Produit *",field:"productId",type:"select",opts:products.map(p=>({v:p.id,l:p.name}))},
            {label:"Emplacement *",field:"locationId",type:"select",opts:locations.map(l=>({v:l.id,l:l.name}))},
            ...(form.type==="transfert"?[{label:"Destination *",field:"toLocationId",type:"select",opts:locations.map(l=>({v:l.id,l:l.name}))}]:[]),
            {label:"Quantite *",field:"quantity",type:"number"},
            {label:"Motif",field:"reason"},
            {label:"Reference",field:"ref"},
            ...(form.type==="sortie"||form.type==="transfert"?[{label:"Chantier",field:"chantierId",type:"select",opts:[{v:"",l:"Aucun"},...chantiers.map(c=>({v:c.id,l:c.name}))]}]:[])
          ].map(fi=>(
            <div key={fi.field}>
              <label style={{display:"block",fontSize:11,color:"#888",marginBottom:5,textTransform:"uppercase",letterSpacing:".08em",fontFamily:"'DM Mono',monospace"}}>{fi.label}</label>
              {fi.type==="select"
                ? <select className="if" value={form[fi.field]||""} onChange={e=>setForm(f=>({...f,[fi.field]:e.target.value}))}>
                    <option value="">Choisir...</option>
                    {fi.opts.map(o=><option key={o.v} value={o.v}>{o.l}</option>)}
                  </select>
                : <input className="if" type={fi.type||"text"} inputMode={fi.type==="number"?"numeric":"text"} value={form[fi.field]||""} onChange={e=>setForm(f=>({...f,[fi.field]:e.target.value}))}/>
              }
            </div>
          ))}
        </div>
        <div style={{display:"flex",gap:10,marginTop:20}}>
          <button className="bo" style={{flex:1}} onClick={()=>setModal(null)}>Annuler</button>
          <button className="bp" style={{flex:2}} onClick={addMovement}>Enregistrer</button>
        </div>
      </div>
    </div>
  );

  // === MODAL NOUVEAU PRODUIT ===
  const renderModalNewProduct = () => (
    <div className="ov" onClick={()=>setModal(null)}>
      <div className="mb" onClick={e=>e.stopPropagation()}>
        <div className="mb-handle"/>
        <h2 style={{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:18,marginBottom:20}}>Nouveau produit</h2>
        <div style={{display:"flex",flexDirection:"column",gap:14}}>
          {[
            {label:"Nom *",field:"name",full:true},
            {label:"SKU *",field:"sku"},
            {label:"Stock min.",field:"minStock",type:"number"},
            {label:"Unite",field:"unit"}
          ].map(fi=>(
            <div key={fi.field}>
              <label style={{display:"block",fontSize:11,color:"#888",marginBottom:5,textTransform:"uppercase",letterSpacing:".08em",fontFamily:"'DM Mono',monospace"}}>{fi.label}</label>
              <input className="if" type={fi.type||"text"} inputMode={fi.type==="number"?"numeric":"text"} value={form[fi.field]||""} onChange={e=>setForm(f=>({...f,[fi.field]:e.target.value}))}/>
            </div>
          ))}
          <div>
            <label style={{display:"block",fontSize:11,color:"#888",marginBottom:5,textTransform:"uppercase",letterSpacing:".08em",fontFamily:"'DM Mono',monospace"}}>Categorie *</label>
            <select className="if" value={form.category||""} onChange={e=>setForm(f=>({...f,category:e.target.value}))}>
              <option value="">Choisir...</option>
              {categories.map(c=><option key={c} value={c}>{c}</option>)}
            </select>
          </div>
        </div>
        <div style={{display:"flex",gap:10,marginTop:20}}>
          <button className="bo" style={{flex:1}} onClick={()=>setModal(null)}>Annuler</button>
          <button className="bp" style={{flex:2}} onClick={()=>{
            const {name,sku,category,minStock,unit} = form;
            if(!name||!sku||!category) return showToast("Champs manquants","error");
            const np=[...products,{id:Date.now(),name,sku,category,minStock:parseInt(minStock)||5,unit:unit||"unite"}];
            setProducts(np);
            saveAll(np,null,null,null,null,null);
            showToast("Produit ajoute !");
            setModal(null);setForm({});
          }}>Ajouter</button>
        </div>
      </div>
    </div>
  );

  // === MODAL DETAIL PRODUIT ===
  const renderModalProductDetail = () => {
    if(!modal?.data) return null;
    const p=modal.data;
    const pm=movements.filter(m=>m.productId===p.id);
    const total=getTotalStock(p.id);
    const st=getStockStatus(p);
    return (
      <div className="ov" onClick={()=>setModal(null)}>
        <div className="mb" onClick={e=>e.stopPropagation()}>
          <div className="mb-handle"/>
          <div style={{marginBottom:16}}>
            <h2 style={{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:18}}>{p.name}</h2>
            <p style={{color:"#aaa",fontSize:12,fontFamily:"'DM Mono',monospace"}}>{p.sku} · {p.category}</p>
          </div>

          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
            <div className="sc b" style={{padding:"12px 14px"}}>
              <div style={{fontSize:10,color:"#aaa",textTransform:"uppercase",marginBottom:4,fontFamily:"'DM Mono',monospace"}}>Stock total</div>
              <div style={{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:22}}>{total} <span style={{fontSize:12,fontWeight:400,color:"#888"}}>{p.unit}</span></div>
            </div>
            <div className={"sc "+(st==="ok"?"g":st==="warn"?"y":"r")} style={{padding:"12px 14px"}}>
              <div style={{fontSize:10,color:"#aaa",textTransform:"uppercase",marginBottom:4,fontFamily:"'DM Mono',monospace"}}>Statut</div>
              <span className={st==="ok"?"bok":st==="warn"?"bwn":"blow"}>{st==="ok"?"OK":st==="warn"?"Bas":"Rupture"}</span>
            </div>
          </div>

          <div style={{marginBottom:16}}>
            <div style={{fontSize:11,color:"#aaa",textTransform:"uppercase",marginBottom:8,fontFamily:"'DM Mono',monospace"}}>Par emplacement</div>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {locations.map(l=>{
                const q=locStocks[p.id+"_"+l.id]||0;
                const max=p.minStock*3||1;
                const pct=Math.min(100,Math.round(q/max*100));
                return (
                  <div key={l.id} style={{display:"flex",alignItems:"center",gap:10}}>
                    <span style={{fontFamily:"'DM Mono',monospace",fontSize:12,color:"#555",flex:"0 0 130px",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{l.name}</span>
                    <div className="pb" style={{flex:1}}><div className="pf" style={{width:pct+"%",background:l.color}}/></div>
                    <span style={{fontFamily:"'Syne',sans-serif",fontWeight:500,fontSize:13,minWidth:40,textAlign:"right",color:q>0?"#1a1a1a":"#ccc"}}>{q}</span>
                  </div>
                );
              })}
            </div>
          </div>

          <div style={{marginBottom:16}}>
            <div style={{fontSize:11,color:"#aaa",textTransform:"uppercase",marginBottom:8,fontFamily:"'DM Mono',monospace"}}>Historique recent</div>
            {pm.length===0
              ? <p style={{color:"#ccc",fontSize:12}}>Aucun mouvement.</p>
              : [...pm].reverse().slice(0,5).map(m=>(
                <div key={m.id} style={{display:"flex",justifyContent:"space-between",padding:"8px 0",borderBottom:"1px solid #f0f0f0"}}>
                  <div style={{display:"flex",gap:8,alignItems:"center",flex:1,minWidth:0}}>
                    <span className={tC(m.type)}>{tL(m.type)}</span>
                    <div style={{minWidth:0}}>
                      <div style={{fontSize:12,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{m.reason||"—"}</div>
                      <div style={{fontSize:11,color:"#ccc"}}>{getLN(m.locationId)}</div>
                    </div>
                  </div>
                  <div style={{textAlign:"right",marginLeft:8}}>
                    <div style={{color:m.type==="entree"?"#3d9e6a":m.type==="transfert"?"#4a7acc":"#d05040",fontWeight:600}}>{m.type==="entree"?"+":m.type==="transfert"?">>":"-"}{m.quantity}</div>
                    <div style={{fontSize:11,color:"#ccc"}}>{m.date}</div>
                  </div>
                </div>
              ))
            }
          </div>

          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
            <button className="bo" style={{padding:"11px 8px",fontSize:12}} onClick={()=>{setModal(null);setTimeout(()=>{setForm({type:"sortie",productId:String(p.id)});setModal("movement");},80);}}>- Sortie</button>
            <button className="bo" style={{padding:"11px 8px",fontSize:12}} onClick={()=>{setModal(null);setTimeout(()=>{setForm({type:"transfert",productId:String(p.id)});setModal("movement");},80);}}>Transfert</button>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
            <button className="bd" style={{padding:"11px 8px",fontSize:12}} onClick={()=>delProd(p.id)}>Supprimer</button>
            <button className="bp" style={{padding:"11px 8px",fontSize:12}} onClick={()=>{setModal(null);setTimeout(()=>{setForm({type:"entree",productId:String(p.id)});setModal("movement");},80);}}>+ Entree</button>
          </div>
        </div>
      </div>
    );
  };

  const tabConfig = [
    {id:"dashboard", label:"Accueil", icon:"🏠"},
    {id:"produits",  label:"Produits", icon:"📦"},
    {id:"mouvements",label:"Mouvements", icon:"↕️"},
    {id:"lieux",     label:"Lieux", icon:"📍"},
    {id:"chantiers", label:"Chantiers", icon:"🔨"},
  ];

  const tabTitles = {dashboard:"StockFlow",produits:"Produits",mouvements:"Mouvements",lieux:"Entrepots",chantiers:"Chantiers"};

  const showFAB = tab==="produits"||tab==="mouvements"||tab==="chantiers";

  return (
    <div style={{fontFamily:"'DM Mono',monospace",background:"#f5f5f3",minHeight:"100vh"}}>
      <style>{CSS}</style>

      {/* Header */}
      <div className="top-header">
        <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:18,letterSpacing:"-0.02em"}}>{tabTitles[tab]}</div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          {syncing && <span className="syncing" style={{fontSize:11,color:"#aaa"}}>sync...</span>}
          <button className="bsm" onClick={()=>window._fa.signOut(window._auth).then(onLogout)} style={{fontSize:11,color:"#aaa"}}>Sortir</button>
        </div>
      </div>

      {/* Content */}
      <div className="main-content">
        {tab==="dashboard" && renderDashboard()}
        {tab==="produits" && renderProduits()}
        {tab==="mouvements" && renderMouvements()}
        {tab==="lieux" && renderLieux()}
        {tab==="chantiers" && renderChantiers()}
      </div>

      {/* FAB */}
      {showFAB && (
        <button className="bp" style={{
          position:"fixed",
          bottom:"calc(76px + env(safe-area-inset-bottom))",
          right:20,
          width:52,height:52,
          borderRadius:"50%",
          fontSize:24,
          padding:0,
          boxShadow:"0 4px 16px rgba(232,160,0,0.4)",
          display:"flex",alignItems:"center",justifyContent:"center",
          zIndex:45
        }}
          onClick={()=>{
            setForm({});
            if(tab==="produits") setModal("new-product");
            else setModal("movement");
          }}>+</button>
      )}

      {/* Bottom Nav */}
      <nav className="nav-bar">
        {tabConfig.map(t=>(
          <button key={t.id} className={"nb"+(tab===t.id?" a":"")} onClick={()=>{setTab(t.id);setSearch("");}}>
            <span className="nb-icon">{t.icon}</span>
            {t.label}
          </button>
        ))}
      </nav>

      {/* Modals */}
      {modal==="movement" && renderModalMouvement()}
      {modal==="new-product" && renderModalNewProduct()}
      {modal?.type==="product-detail" && renderModalProductDetail()}

      {toast && <div className={"toast "+toast.type}>{toast.type==="success"?"✓":"✗"} {toast.msg}</div>}
    </div>
  );
}

function App() {
  const [user, setUser] = useState(null);
  const [checking, setChecking] = useState(true);
  useEffect(()=>{
    const init = async () => {
      if (!window._fbReady) await new Promise(r=>window.addEventListener("fb-ready",r,{once:true}));
      window._fa.onAuthStateChanged(window._auth, u => { setUser(u?u.email:null); setChecking(false); });
    };
    init();
  },[]);
  if (checking) return (
    <div style={{minHeight:"100vh",background:"#f5f5f3",display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{width:32,height:32,border:"2px solid #e0e0e0",borderTop:"2px solid #e8a000",borderRadius:"50%",animation:"spin 1s linear infinite"}}/>
      <style>{"@keyframes spin{to{transform:rotate(360deg)}}"}</style>
    </div>
  );
  if (!user) return <LoginScreen onLogin={setUser}/>;
  return <StockApp user={user} onLogout={()=>setUser(null)}/>;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
